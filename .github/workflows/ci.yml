name: CI

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev
  workflow_dispatch:

# 最小权限：CI 只需要读取仓库内容
permissions:
  contents: read

# 同一分支上推送新提交时，取消仍在运行的旧任务，避免排队浪费时间
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端质量门禁（ruff / mypy / pytest）
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      ENV: test

      DB__HOST: 127.0.0.1
      DB__PORT: "5432"
      DB__USERNAME: app_runtime
      DB__HASHED_PASSWORD: ci_app_only
      DB__DRIVER: postgresql+psycopg2
      DB__NAME: harness

      AUTH_DB__HOST: 127.0.0.1
      AUTH_DB__PORT: "5432"
      AUTH_DB__USERNAME: auth_service
      AUTH_DB__HASHED_PASSWORD: ci_auth_only
      AUTH_DB__NAME: harness
      AUTH_DB__DRIVER: postgresql+psycopg2

      OPS_DB__HOST: 127.0.0.1
      OPS_DB__PORT: "5432"
      OPS_DB__USERNAME: ops_runtime
      OPS_DB__HASHED_PASSWORD: ci_ops_only
      OPS_DB__NAME: harness
      OPS_DB__DRIVER: postgresql+psycopg2

      MIGRATION_DB__HOST: 127.0.0.1
      MIGRATION_DB__PORT: "5432"
      MIGRATION_DB__USERNAME: migration_owner
      MIGRATION_DB__HASHED_PASSWORD: ci_migration_only
      MIGRATION_DB__NAME: harness
      MIGRATION_DB__DRIVER: postgresql+psycopg2

      ADMIN_DB__HOST: 127.0.0.1
      ADMIN_DB__PORT: "5432"
      ADMIN_DB__USERNAME: harness
      ADMIN_DB__HASHED_PASSWORD: dev_only_password
      ADMIN_DB__NAME: harness
      ADMIN_DB__DRIVER: postgresql+psycopg2

      REDIS__HOST: 127.0.0.1
      REDIS__PORT: "6379"
      REDIS__DB: "0"
      REDIS__HASHED_PASSWORD: ci_only_not_a_secret

      HARNESS_TEST_DB_NAME: harness_test

      SECURITY__CSRF_SIGNING_KEY: ci_only_signing_key_not_a_real_secret_0000

    services:
      postgres:
        image: pgvector/pgvector:pg17          # 与 deploy/compose.yaml 保持一致
        env:
          POSTGRES_USER: harness
          POSTGRES_PASSWORD: dev_only_password
          POSTGRES_DB: harness
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U harness"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: 安装 Python
        run: uv python install

      - name: 安装依赖
        run: uv sync --locked

      - name: 缓存 mypy
        uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: ${{ runner.os }}-mypy-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-mypy-

      - name: 缓存 pytest
        uses: actions/cache@v4
        with:
          path: .pytest_cache
          key: ${{ runner.os }}-pytest-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-pytest-

      - name: Ruff 静态检查
        run: uv run ruff check --output-format=github .

      - name: Ruff 格式检查
        run: uv run ruff format --check .

      - name: mypy 类型检查
        run: uv run mypy

      - name: 初始化数据库角色
        env:
          PGPASSWORD: dev_only_password
        run: |
          psql -h 127.0.0.1 -U harness -d harness \
            -v ON_ERROR_STOP=1 \
            -1 \
            -f scripts/sql/bootstrap_roles.sql

          psql -h 127.0.0.1 -U harness -d harness \
            -v ON_ERROR_STOP=1 <<'SQL'
          ALTER ROLE migration_owner PASSWORD 'ci_migration_only';
          ALTER ROLE app_runtime PASSWORD 'ci_app_only';
          ALTER ROLE auth_service PASSWORD 'ci_auth_only';
          ALTER ROLE ops_runtime PASSWORD 'ci_ops_only';
          SQL

      - name: pytest 单元测试
        run: uv run pytest -q
