services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${ADMIN_DB__USERNAME:?缺少 ADMIN_DB__USERNAME}"
      POSTGRES_PASSWORD: "${ADMIN_DB__HASHED_PASSWORD:?缺少 ADMIN_DB__HASHED_PASSWORD}"
      POSTGRES_DB: "${ADMIN_DB__NAME:?缺少 ADMIN_DB__NAME}"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # 走 TCP 探测：避开初始化期临时实例只在 unix socket 上监听造成的假阳性
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: "${REDIS__HASHED_PASSWORD:?缺少 REDIS__HASHED_PASSWORD：请复制 .env.example 为 .env 并填写}"
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      # REDISCLI_AUTH 代替 -a：不用 --no-auth-warning，也不把密码写进进程参数
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

volumes:
  pgdata:
  redisdata:

