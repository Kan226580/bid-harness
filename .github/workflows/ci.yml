name: CI

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev
  workflow_dispatch:

# 最小权限：CI 只需要读取仓库内容
permissions:
  contents: read

# 同一分支上推送新提交时，取消仍在运行的旧任务，避免排队浪费时间
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端质量门禁（ruff / mypy / pytest）
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ENV: test

      DB__HOST: 127.0.0.1
      DB__PORT: "5432"
      DB__USERNAME: app_runtime
      DB__HASHED_PASSWORD: ci_app_only
      DB__DRIVER: postgresql+psycopg2
      DB__NAME: harness

      AUTH_DB__HOST: 127.0.0.1
      AUTH_DB__PORT: "5432"
      AUTH_DB__USERNAME: auth_service
      AUTH_DB__HASHED_PASSWORD: ci_auth_only
      AUTH_DB__NAME: harness
      AUTH_DB__DRIVER: postgresql+psycopg2

      OPS_DB__HOST: 127.0.0.1
      OPS_DB__PORT: "5432"
      OPS_DB__USERNAME: ops_runtime
      OPS_DB__HASHED_PASSWORD: ci_ops_only
      OPS_DB__NAME: harness
      OPS_DB__DRIVER: postgresql+psycopg2

      MIGRATION_DB__HOST: 127.0.0.1
      MIGRATION_DB__PORT: "5432"
      MIGRATION_DB__USERNAME: migration_owner
      MIGRATION_DB__HASHED_PASSWORD: ci_migration_only
      MIGRATION_DB__NAME: harness
      MIGRATION_DB__DRIVER: postgresql+psycopg2

      ADMIN_DB__HOST: 127.0.0.1
      ADMIN_DB__PORT: "5432"
      ADMIN_DB__USERNAME: harness
      ADMIN_DB__HASHED_PASSWORD: dev_only_password
      ADMIN_DB__NAME: harness
      ADMIN_DB__DRIVER: postgresql+psycopg2

      REDIS__HOST: 127.0.0.1
      REDIS__PORT: "6381"
      REDIS__DB: "15"
      REDIS__HASHED_PASSWORD: ci_only_not_a_secret

      HARNESS_TEST_DB_NAME: harness_test

      SECURITY__CSRF_SIGNING_KEY: ci_only_signing_key_not_a_real_secret_0000

      E2E_ORG_SLUG: ci-e2e
      E2E_ADMIN_EMAIL: admin@ci.example.com

    services:
      postgres:
        image: pgvector/pgvector:pg17          # 与 deploy/compose.yaml 保持一致
        env:
          POSTGRES_USER: harness
          POSTGRES_PASSWORD: dev_only_password
          POSTGRES_DB: harness
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U harness"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: 安装 Python
        run: uv python install

      - name: 安装依赖
        run: uv sync --locked

      - name: 缓存 mypy
        uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: ${{ runner.os }}-mypy-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-mypy-

      - name: 缓存 pytest
        uses: actions/cache@v4
        with:
          path: .pytest_cache
          key: ${{ runner.os }}-pytest-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-pytest-

      - name: Ruff 静态检查
        run: uv run ruff check --output-format=github .

      - name: Ruff 格式检查
        run: uv run ruff format --check .

      - name: mypy 类型检查
        run: uv run mypy

      - name: 初始化数据库角色
        env:
          PGPASSWORD: dev_only_password
        run: |
          psql -h 127.0.0.1 -U harness -d harness \
            -v ON_ERROR_STOP=1 \
            -1 \
            -f scripts/sql/bootstrap_roles.sql

          psql -h 127.0.0.1 -U harness -d harness \
            -v ON_ERROR_STOP=1 <<'SQL'
          ALTER ROLE migration_owner PASSWORD 'ci_migration_only';
          ALTER ROLE app_runtime PASSWORD 'ci_app_only';
          ALTER ROLE auth_service PASSWORD 'ci_auth_only';
          ALTER ROLE ops_runtime PASSWORD 'ci_ops_only';
          SQL

      - name: 启动 A8 专用 Redis
        shell: bash
        run: |
          container_id=$(docker run --detach \
            --name "a8-redis-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --label harness.a8-reliability=true \
            --publish 127.0.0.1:6381:6379 \
            redis:7 redis-server --appendonly yes \
            --requirepass "$REDIS__HASHED_PASSWORD")
          echo "A8_REDIS_CONTAINER_ID=$container_id" >> "$GITHUB_ENV"
          ready=false
          for attempt in {1..30}; do
            if docker exec -e REDISCLI_AUTH="$REDIS__HASHED_PASSWORD" \
              "$container_id" redis-cli ping | grep -q PONG; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            docker logs "$container_id"
            exit 1
          fi

      - name: 单元与普通集成测试
        run: uv run pytest -q -m "not reliability"

      - name: A8 六条可靠性验收
        shell: bash
        run: |
          uv run pytest -q backend/tests/integration/test_runs_a8.py \
            -m reliability \
            --basetemp "$RUNNER_TEMP/a8-reliability"

      - name: 保存 A8 故障日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a8-reliability-logs
          path: ${{ runner.temp }}/a8-reliability
          if-no-files-found: ignore

      - name: 清理 A8 Redis
        if: always()
        shell: bash
        run: |
          if [ -n "${A8_REDIS_CONTAINER_ID:-}" ]; then
            docker rm -f "$A8_REDIS_CONTAINER_ID"
          fi

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装 E2E 依赖
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: 迁移 E2E 数据库
        run: uv run alembic upgrade head

      - name: 创建 E2E 专用管理员
        run: |
          uv run python - <<'PY'
          import os
          import secrets
          
          from backend.app.core.security import hash_password
          from backend.app.core.settings import settings
          from backend.app.db.session import AuthSessionLocal
          from backend.app.models import Organization, User
          
          if (
              os.environ.get("CI") != "true"
              or settings.env != "test"
              or settings.auth_db.name != "harness"
          ):
              raise SystemExit("仅允许在 CI 临时数据库创建 E2E 账号")
          
          password = secrets.token_urlsafe(24)
          print(f"::add-mask::{password}", flush=True)
          
          with AuthSessionLocal.begin() as db:
              organization = Organization(
                  slug=os.environ["E2E_ORG_SLUG"],
                  name="CI 测试组织",
              )
              db.add(organization)
              db.flush()
          
              db.add(User(
                  org_id=organization.id,
                  email=os.environ["E2E_ADMIN_EMAIL"],
                  display_name="CI 管理员",
                  password_hash=hash_password(password),
                  role="admin",
                  must_change_password=False,
              ))
          
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"E2E_ADMIN_PASSWORD={password}\n")
          PY

      - name: 启动 API 并运行前端 E2E
        env:
          CI: "true"
          SECURITY__PUBLIC_ORIGIN: http://127.0.0.1:5173
        shell: bash
        run: |
          uv run uvicorn backend.app.main:app \
            --host 127.0.0.1 --port 8000 \
            > "$RUNNER_TEMP/e2e-api.log" 2>&1 &
          
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          
          ready=false
          for attempt in {1..60}; do
            if ! kill -0 "$api_pid" 2>/dev/null; then
              break
            fi
            if curl --fail --silent --max-time 2 \
              http://127.0.0.1:8000/health/live > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          
          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/e2e-api.log"
            exit 1
          fi
          
          cd frontend
          npm run test:e2e || {
            cat "$RUNNER_TEMP/e2e-api.log"
            exit 1
          }

  frontend:
    name: 前端质量门禁
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        run: npm ci

      - name: 格式检查
        run: npm run format:check

      - name: ESLint 检查
        run: npm run lint

      - name: TypeScript 类型检查
        run: npm run typecheck

      - name: 构建前端
        run: npm run build
